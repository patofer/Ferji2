# Configuraci?n SSL completa
systemProp.jdk.insecure.ssl.ignoreAllCertIssues=true
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT

# Configuraci?n de Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=true



# 3. Habilita el "Gradle Daemon", un proceso en segundo plano que mantiene la info de tu proyecto en memoria.
org.gradle.daemon=true

# 4. Habilita la "Configuraci?n bajo demanda". En proyectos multi-m?dulo, configura solo los m?dulos necesarios.
org.gradle.configureondemand=true

# 5. Configuration Cache: acelera MUCHO builds repetidos (evita re-evaluar scripts de Gradle).
# Temporalmente DESHABILITADO por cuelgues intermitentes en compileDebugKotlin.
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn

# 6. KSP y Kotlin incrementales.
# DESACTIVADOS temporalmente: KSP incremental tiene bugs en Windows que dejan
# compileDebugKotlin en IDLE indefinidamente. Se puede reactivar una vez que el build funcione.
ksp.incremental=false
ksp.incremental.intermodule=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Estrategia de compilación de Kotlin.
# 'daemon' es el default y el que Android Studio espera. Si vuelven los cuelgues desde CLI,
# cambiar a 'in-process' SOLO para compilar por terminal.
kotlin.compiler.execution.strategy=daemon

# Workers de Gradle limitados para no saturar I/O en Windows.
org.gradle.workers.max=2

# 7. No validar si hay nuevas versiones de dependencias en cada build.
android.enableJetifier=false
